# Minimal customer config reference.
# Prefer applying settings with scripts/configure-hostinger-line.sh because Hostinger images may ship newer default config keys.
# This file is here as a human-readable reference, not a full replacement for /opt/data/config.yaml.

timezone: Asia/Taipei

agent:
  reasoning_effort: medium
  gateway_timeout: 1800
  gateway_timeout_warning: 900

compression:
  enabled: true
  codex_gpt55_autoraise: false

security:
  redact_secrets: true

# Voice/STT is optional. Only enable if the client needs LINE voice transcription.
stt:
  enabled: false
  provider: local
